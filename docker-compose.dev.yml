services:
  backend:
    image: neurodatics-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile

  worker:
    image: neurodatics-backend:local

  frontend:
    image: neurodatics-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_INTERNAL_API_BASE_URL: ${NEXT_INTERNAL_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_API_UPLOAD_PORT: ${BACKEND_PORT:-8000}
