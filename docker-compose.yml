name: neurodatics

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker.}@db:5432/neurodatics}"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-3}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-3}
  AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env before starting Docker.}"
  AUTH_USER_STORE_PATH: ${AUTH_USER_STORE_PATH:-/data/auth_users.json}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,frontend,backend,db,redis}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,frontend,backend,db,redis}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/authorize}
  GOOGLE_DRIVE_OAUTH_REDIRECT_URI: ${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:-http://localhost:3000/api/integrations/google-drive/callback}
  GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
  GDRIVE_REFRESH_TOKEN: ${GDRIVE_REFRESH_TOKEN:-}
  GDRIVE_HTTP_TIMEOUT_SECONDS: ${GDRIVE_HTTP_TIMEOUT_SECONDS:-300}
  GDRIVE_REQUEST_RETRIES: ${GDRIVE_REQUEST_RETRIES:-5}
  PROJECT_ZIP_MAX_SIZE_MB: ${PROJECT_ZIP_MAX_SIZE_MB:-500}
  PROJECT_ZIP_MAX_UNCOMPRESSED_MB: ${PROJECT_ZIP_MAX_UNCOMPRESSED_MB:-2000}
  PROJECT_ZIP_MAX_ENTRY_UNCOMPRESSED_MB: ${PROJECT_ZIP_MAX_ENTRY_UNCOMPRESSED_MB:-600}
  PROJECT_ZIP_MAX_ENTRIES: ${PROJECT_ZIP_MAX_ENTRIES:-20000}
  PROJECT_ZIP_MAX_COMPRESSION_RATIO: ${PROJECT_ZIP_MAX_COMPRESSION_RATIO:-100}
  UPLOAD_MAX_CONCURRENT_PER_USER: ${UPLOAD_MAX_CONCURRENT_PER_USER:-1}
  UPLOAD_MAX_CONCURRENT_GLOBAL: ${UPLOAD_MAX_CONCURRENT_GLOBAL:-4}
  UPLOAD_MIN_SECONDS_BETWEEN_UPLOADS: ${UPLOAD_MIN_SECONDS_BETWEEN_UPLOADS:-5}
  GDRIVE_SYNC_ALLOWED_ROOT: ${GDRIVE_SYNC_ALLOWED_ROOT:-}
  INGESTION_SAVE_ORIGINAL_ZIP: ${INGESTION_SAVE_ORIGINAL_ZIP:-true}
  PARQUET_CACHE_DIR: ${PARQUET_CACHE_DIR:-/data/parquet_cache}
  PARQUET_CACHE_TTL_HOURS: ${PARQUET_CACHE_TTL_HOURS:-4}
  ANALYTICS_REDIS_TTL_SECONDS: ${ANALYTICS_REDIS_TTL_SECONDS:-900}
  IMAGE_CACHE_DIR: ${IMAGE_CACHE_DIR:-/data/image_cache}
  VIDEO_CACHE_DIR: ${VIDEO_CACHE_DIR:-/data/video_cache}
  VIDEO_FRAME_CACHE_DIR: ${VIDEO_FRAME_CACHE_DIR:-/data/video_frame_cache}
  APP_NAME: ${APP_NAME:-NeuroDatics API}
  DEBUG: ${DEBUG:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurodatics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker.}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: neurodatics-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - neurodatics_data:/data
    networks:
      - app
      - data
    # Ingestion streams large archives through this container. A hard ceiling
    # turns "one oversized upload" into a failed request instead of an OOM kill
    # that takes the API down for everyone.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    mem_reservation: ${BACKEND_MEM_RESERVATION:-512m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: neurodatics-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_INTERNAL_API_BASE_URL: ${NEXT_INTERNAL_API_BASE_URL:-http://backend:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_INTERNAL_API_BASE_URL: ${NEXT_INTERNAL_API_BASE_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  neurodatics_data:

networks:
  app:
  data:
    internal: true
