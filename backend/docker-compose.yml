version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - image_cache:/data/image_cache
      - video_cache:/data/video_cache
      - video_frame_cache:/data/video_frame_cache

volumes:
  image_cache:
  video_cache:
  video_frame_cache:
